        '<h2>' + title + '</h2><p>' + blurb + '</p></div>' +
      '<div class="qs-label">Start with a focus area</div>' +
      '<div class="qs-grid">' + cells + '</div>' +
      '<button class="custom-link" data-area="general">Or write a custom task →</button>';
    return wrap;
  }

  // A cheap fingerprint of everything the feed actually draws — deliberately
  // EXCLUDES relative timestamps so an otherwise-idle board doesn't rebuild (and
  // flicker) every poll. Live work (a running task's log growing, a status
  // transition, a fix-up attempt) still changes the signature and re-renders.
  function feedSig(vis) {
    var parts = vis.map(function (t) {
      var d = t.diff;
      return [t.id, t.status, t.fixAttempts || 0, (t.log || []).length,
        t.category || "", t.prompt || "",
        t.summary ? t.summary.length : 0, t.detail ? t.detail.length : 0,
        d ? (d.files + "/" + d.additions + "/" + d.deletions) : "",
        t.error ? 1 : 0, t.schedule ? JSON.stringify(t.schedule) : "",
        t.nextRun || "", openDetails[t.id] ? 1 : 0,
        openDiffs[t.id] ? 1 : 0, diffCache[t.id] ? (diffCache[t.id].loading ? "L" : (diffCache[t.id].error ? "E" : "D")) : ""].join("~");
    });
    return parts.join("|") + "@" + activeFilter + "@" + (showAllDone ? 1 : 0);
  }

  function renderAll() {
    var vis = visible();
    var sig = feedSig(vis);
    if (sig === lastFeedSig) { renderDetail(); return; } // nothing drew differently
    lastFeedSig = sig;
    var sc = vis.filter(function (t) { return t.status === "scheduled"; })
      .sort(function (a, b) { return (a.nextRun || "") < (b.nextRun || "") ? -1 : 1; });
    var ap = vis.filter(function (t) { return t.status === "needs_approval"; });
    var ru = vis.filter(function (t) { return t.status === "running"; });
    var pl = vis.filter(function (t) { return PIPELINE_STATUSES.indexOf(t.status) >= 0; });
    var qu = vis.filter(function (t) { return t.status === "queued"; });
    var dn = vis.filter(function (t) { return DONE_STATUSES.indexOf(t.status) >= 0; });

    // Same reason as renderDetail: tapping "Review changes" on the third card
    // must not scroll the board back to the first one.
    var keepTop = feed.scrollTop;
    feed.innerHTML = "";
    if (ap.length + ru.length + pl.length + sc.length + qu.length + dn.length === 0) {
      feed.appendChild(emptyState());
    } else {
      if (ap.length) feed.appendChild(buildSection("Needs your review", "approval", ap, approvalCard));
      if (ru.length) feed.appendChild(buildSection("Running now", "running", ru, runningCard));
      if (pl.length) feed.appendChild(buildSection("Verifying & shipping", "pipeline", pl, pipelineCard));
      if (sc.length) feed.appendChild(buildSection("Scheduled", "scheduled", sc, scheduledCard));
      if (qu.length) feed.appendChild(buildSection("Queued", "queued", qu, queuedCard));
      if (dn.length) feed.appendChild(buildHistory(dn));
    }
    if (keepTop) feed.scrollTop = Math.min(keepTop, Math.max(0, feed.scrollHeight - feed.clientHeight));
    // Keep the detail selection valid; otherwise auto-pick the top task.
    if (!selectedId || !find(selectedId)) selectedId = pickDefault(vis);
    renderDetail();
    updateOverview(vis);
  }

  function updateOverview(vis) {
    var run = 0, ap = 0, sh = 0, qu = 0, sc = 0;
    vis.forEach(function (t) {
      if (t.status === "running") run++;
      else if (t.status === "needs_approval") ap++;
      else if (PIPELINE_STATUSES.indexOf(t.status) >= 0) sh++;
      else if (t.status === "queued") qu++;
      else if (t.status === "scheduled") sc++;
    });
    var bits = [];
    if (run) bits.push('<span class="live">● ' + run + ' running</span>');
    if (sh) bits.push('<span class="ship">● ' + sh + ' shipping</span>');
    if (ap) bits.push('<span class="warn">' + ap + ' to review</span>');
    if (qu) bits.push(qu + " queued");
    if (sc) bits.push(sc + " scheduled");
    headStatus.innerHTML = bits.length ? bits.join(" · ") : "All clear";
  }

  /* ---------- actions ---------- */
  function find(id) { return tasks.find(function (t) { return t.id === id; }); }
  feed.addEventListener("click", function (e) {
    var qs = e.target.closest("[data-area]");
    if (qs) { openSheetForArea(qs.getAttribute("data-area")); return; }
    var more = e.target.closest("[data-more]");
    if (more) { showAllDone = !showAllDone; renderAll(); return; }
    var dt = e.target.closest("[data-detail]");
    var dCard = e.target.closest("[data-id]");
    if (dt && dCard) { var did = dCard.getAttribute("data-id"); openDetails[did] = !openDetails[did]; lastFeedSig = ""; renderAll(); return; }
    var df = e.target.closest("[data-diff]");
    if (df && dCard) { toggleDiff(dCard.getAttribute("data-id")); return; }
    var btn = e.target.closest("[data-action]");
    var card = e.target.closest("[data-id]");
    // Any click on a card selects it (fills the detail pane on desktop).
    if (card) { selectedId = card.getAttribute("data-id"); renderDetail(); }
    if (btn && card) act(btn.getAttribute("data-action"), card.getAttribute("data-id"), btn);
  });

  // The detail pane drives the same actions for the selected task.
  detail.addEventListener("click", function (e) {
    if (!selectedId) return;
    if (e.target.closest("[data-diff]")) { toggleDiff(selectedId); return; }
    var btn = e.target.closest("[data-action]");
    if (btn) act(btn.getAttribute("data-action"), selectedId, btn);
  });

  function act(action, id, btn) {
    var t = find(id); if (!t) return;
    if (action === "edit") { openSheet("edit", t); return; }
    if (btn) btn.disabled = true;
    var p;
    if (action === "accept") p = api("POST", "/api/ops/tasks/" + id + "/accept").then(function (r) { toast("ok", (r && r.verifying) ? "Approved — verifying tests, then shipping" : ("Applied to " + t.project + " — review & commit when ready")); });
    else if (action === "reject") p = api("POST", "/api/ops/tasks/" + id + "/reject").then(function () { toast("info", "Rejected — changes discarded"); });
    else if (action === "cancel") p = api("POST", "/api/ops/tasks/" + id + "/cancel").then(function () { toast("info", "Cancelling run…"); });
    else if (action === "run") p = api("POST", "/api/ops/tasks/" + id + "/run").then(function () { toast("ok", "Running now…"); });
    // Retry drives the SAME route: runNow() decides whether this status may be
    // re-run and, when it refuses, throws a sentence written for the operator
    // ("this task's changes are already in your working tree — …"). That sentence
    // is far too long and too important for a 2.6s toast, so it gets a dialog and
    // is shown exactly as the server wrote it.
    else if (action === "retry") {
      p = api("POST", "/api/ops/tasks/" + id + "/run")
        .then(function () { toast("ok", "Retrying…"); })
        .catch(function (err) {
          if (btn) btn.disabled = false;
          alertSheet("Can't retry this one", err.message);
          err.handled = true;   // the tail below must not toast it a second time
          throw err;
        });
    }
    else if (action === "delete") {
      // A run spawned by a recurring routine: deleting the run alone leaves the
      // routine creating new ones. Offer to stop the routine instead.
      var routine = t.routineId ? find(t.routineId) : null;
      var recurring = routine && routine.schedule && routine.schedule.type && routine.schedule.type !== "once";
      if (recurring) { confirmRoutineDelete(t, routine, btn); return; }
      p = api("DELETE", "/api/ops/tasks/" + id).then(function () { toast("info", "Removed"); });
    }
    else return;
    p.then(refresh).catch(function (err) {
      if (btn) btn.disabled = false;
      if (err && err.handled) return;   // already explained in a dialog
      toast("bad", err.message);
    });
  }

  /* ---------- sheet ---------- */
  var sheetEl = document.getElementById("sheet");
  var sheetOverlay = document.getElementById("sheetOverlay");
  var sheet = UI.sheet(sheetEl, sheetOverlay);   // drives .open / .settled
  var sheetTitle = document.getElementById("sheetTitle");
  var sheetSub = document.getElementById("sheetSub");
  var sheetSubmit = document.getElementById("sheetSubmit");
  var sProject = document.getElementById("sProject");
  var sPrompt = document.getElementById("sPrompt");
  var sModel = document.getElementById("sModel");
  var sModelNote = document.getElementById("sModelNote");
  var catGrid = document.getElementById("catGrid");
  var schedSeg = document.getElementById("schedSeg");
  var whenBlocks = { once: document.getElementById("whenOnce"), daily: document.getElementById("whenDaily"), weekly: document.getElementById("whenWeekly") };
  var schedAt = document.getElementById("schedAt");
  var schedTimeD = document.getElementById("schedTimeD");
  var schedTimeW = document.getElementById("schedTimeW");
  var schedDay = document.getElementById("schedDay");
  var schedTzNote = document.getElementById("schedTzNote");
  var sheetMode = "new", sheetTargetId = null;
  var schedWhen = "now", schedCat = "general";

  function populateProjectSelect() {
    var prev = sProject.value;
    sProject.innerHTML = "";
    PROJECTS.forEach(function (p) { var o = document.createElement("option"); o.value = p; o.textContent = p; sProject.appendChild(o); });
    if (prev && PROJECTS.indexOf(prev) >= 0) sProject.value = prev;
  }

  /* ---------- sheet: area + schedule controls ---------- */
  function renderCatPicks() {
    catGrid.innerHTML = "";
    CATS.forEach(function (id) {
      var c = catMeta(id);
      var b = document.createElement("button");
      b.type = "button";
      b.className = "cat-pick" + (c.id === schedCat ? " on" : "");
      b.setAttribute("data-cat", c.id);
      b.innerHTML = '<span class="cdot cat-' + esc(c.id) + '" style="background:currentColor"></span>' + esc(c.label);
      catGrid.appendChild(b);
    });
  }
  function setWhen(w) {
    schedWhen = w;
    Array.prototype.forEach.call(schedSeg.children, function (b) { b.classList.toggle("on", b.getAttribute("data-when") === w); });
    Object.keys(whenBlocks).forEach(function (k) { whenBlocks[k].hidden = (k !== w); });
    if (w === "once" && !schedAt.value) {
      var d = new Date(Date.now() + 3600 * 1000); // default: an hour from now
      schedAt.value = d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()) + "T" + pad2(d.getHours()) + ":" + pad2(d.getMinutes());
    }
    updateSubmitLabel();
  }
  function updateSubmitLabel() {
    sheetSubmit.textContent = (schedWhen === "now")
      ? (sheetMode === "new" ? "Queue request" : "Save changes")
      : (sheetMode === "new" ? "Schedule task" : "Save schedule");
  }
  // Build the schedule object the API expects (or null for "run now").
  function currentSchedule() {
    if (schedWhen === "now") return null;
    // Send this device's timezone so the time means the wall clock the user sees,
    // not the server's. The server fires at that zone's time (DST-correct).
    var tz = (Intl.DateTimeFormat().resolvedOptions().timeZone) || "";
    if (schedWhen === "once") {
      if (!schedAt.value) throw new Error("Pick a date and time");
      return { type: "once", at: schedAt.value, tz: tz };
    }
    if (schedWhen === "daily") return { type: "daily", time: schedTimeD.value || "09:00", tz: tz };
    return { type: "weekly", day: Number(schedDay.value), time: schedTimeW.value || "09:00", tz: tz };
  }
  function toLocalInput(iso) {
    var d = new Date(iso); if (isNaN(d)) return "";
    return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()) + "T" + pad2(d.getHours()) + ":" + pad2(d.getMinutes());
  }
  function openSheet(mode, t) {
    sheetMode = mode; sheetTargetId = t ? t.id : null;
    if (mode === "new") {
      sheetTitle.textContent = "New request";
      sheetSub.textContent = "Describe a task — run it now, or set it on a schedule.";
      sProject.value = activeFilter !== "all" ? activeFilter : (PROJECTS[0] || "");
      sPrompt.value = "";
      sModel.value = ""; sModel.disabled = false; sModelNote.hidden = true;
      schedTzNote.hidden = true;
      schedCat = "general";
      schedAt.value = ""; schedTimeD.value = "09:00"; schedTimeW.value = "09:00"; schedDay.value = "1";
      setWhen("now");
    } else {
      var sched = t.schedule;
      sheetTitle.textContent = sched ? "Edit routine" : "Modify request";
      sheetSub.textContent = sched ? "Update this scheduled routine." : "Update the queued task before it runs.";
      sProject.value = t.project;
      sPrompt.value = t.prompt;
      schedCat = t.category || "general";
      schedAt.value = sched && sched.type === "once" ? toLocalInput(sched.at) : "";
      schedTimeD.value = sched && sched.type === "daily" ? sched.time : "09:00";
      schedTimeW.value = sched && sched.type === "weekly" ? sched.time : "09:00";
      schedDay.value = sched && sched.type === "weekly" ? String(sched.day) : "1";
      // editTask does not accept `model`, so show the task's and lock it rather
      // than offering a control whose change would be silently dropped.
      sModel.value = t.model || "";
      if (t.model && sModel.value !== t.model) {
        var o = document.createElement("option");
        o.value = t.model; o.textContent = t.model;
        sModel.appendChild(o); sModel.value = t.model;
      }
      sModel.disabled = true; sModelNote.hidden = false;
      // A routine set in another zone re-anchors to THIS device when saved (the
      // sheet can only send one tz — this one). Say so before they hit Save.
      if (sched && sched.tz && sched.type !== "once" && sched.tz !== deviceTz()) {
        schedTzNote.textContent = "Set in " + sched.tz + ". Saving re-anchors it to this device's time zone (" + deviceTz() + ").";
        schedTzNote.hidden = false;
      } else { schedTzNote.hidden = true; }
      setWhen(sched ? sched.type : "now");
    }
    renderCatPicks();
    updateSubmitLabel();
    sheet.open();
    setTimeout(function () { sPrompt.focus(); }, 180);
  }
  // Open the sheet primed for a focus area (from an empty-state quick-start).
  function openSheetForArea(id) {
    var c = catMeta(id);
    openSheet("new", null);
    schedCat = id;
    if (c.starter) { sPrompt.value = c.starter; }
    renderCatPicks();
  }
  function closeSheet() { sheet.close(); }
  function submitSheet() {
    var prompt = sPrompt.value.trim();
    if (!prompt) { sPrompt.focus(); return; }
    var proj = sProject.value;
    if (!proj) { toast("bad", "No project available"); return; }
    var schedule;
    try { schedule = currentSchedule(); } catch (err) { toast("bad", err.message); return; }
    var body = { project: proj, prompt: prompt, category: schedCat, schedule: schedule };
    // createTask takes { model }; editTask ignores it, so it is only ever sent on
    // create — an ignored field would look like a working control that does nothing.
    if (sheetMode === "new" && sModel.value) body.model = sModel.value;
    var okMsg = schedule ? "Routine scheduled" : "Request queued";
    sheetSubmit.disabled = true;
    var p = sheetMode === "new"
      ? api("POST", "/api/ops/tasks", body).then(function () { toast("ok", okMsg); })
      : api("PATCH", "/api/ops/tasks/" + sheetTargetId, body).then(function () { toast("info", "Request updated"); });
    p.then(function () { closeSheet(); return refresh(); })
      .catch(function (err) { toast("bad", err.message); })
      .then(function () { sheetSubmit.disabled = false; });
  }

  document.getElementById("newBtn").addEventListener("click", function () { openSheet("new", null); });
  document.getElementById("sheetCancel").addEventListener("click", closeSheet);
  sheetSubmit.addEventListener("click", submitSheet);
  schedSeg.addEventListener("click", function (e) { var b = e.target.closest("[data-when]"); if (b) setWhen(b.getAttribute("data-when")); });
  catGrid.addEventListener("click", function (e) { var b = e.target.closest("[data-cat]"); if (!b) return; schedCat = b.getAttribute("data-cat"); renderCatPicks(); });

  /* ---------- confirm dialog ---------- */
  var confirmOverlay = document.getElementById("confirmOverlay");
  var confirmSheet = document.getElementById("confirmSheet");
  var confirmTitle = document.getElementById("confirmTitle");
  var confirmSub = document.getElementById("confirmSub");
  var confirmActions = document.getElementById("confirmActions");
  var confirmResolve = null;
  // Dismissing by overlay tap or Escape must settle the pending promise, or the
  // caller's .then() never runs and the button it disabled stays disabled.
  var confirmSheetCtl = UI.sheet(confirmSheet, confirmOverlay, {
    onClose: function () { var r = confirmResolve; confirmResolve = null; if (r) r(null); }
  });
  function closeConfirm(val) {
    confirmSheetCtl.close(true);      // silent: we settle the promise ourselves
    var r = confirmResolve; confirmResolve = null;
    if (r) r(val == null ? null : val);
  }
  // opts: { title, sub (HTML), actions:[{key,label,cls,grow}] } → resolves to the
  // chosen key, or null if dismissed (overlay/Escape).
  function confirmChoice(opts) {
    confirmTitle.textContent = opts.title || "Confirm";
    confirmSub.innerHTML = opts.sub || "";
    confirmActions.innerHTML = "";
    (opts.actions || []).forEach(function (a) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "btn " + (a.cls || "") + (a.grow ? " grow" : "");
      b.textContent = a.label;
      b.addEventListener("click", function () { closeConfirm(a.key); });
      confirmActions.appendChild(b);
    });
    confirmSheetCtl.open();
    return new Promise(function (resolve) { confirmResolve = resolve; });
  }
  // A refusal from the server, shown in full. The ops runner writes its refusals
  // as sentences meant for a human ("re-running would duplicate the work"); a
  // toast truncates them on a phone, so they get the dialog and nothing else.
  function alertSheet(title, msg) {
    return confirmChoice({
      title: title,
      sub: esc(msg || ""),
      actions: [{ key: "ok", label: "OK", cls: "btn-primary", grow: true }]
    });
  }

  // Deleting a routine-spawned run: ask whether to also stop the routine. "Stop
  // routine" deletes the routine (the server cascades to its pending children),
  // then removes this run too if it wasn't already swept up.
  function confirmRoutineDelete(run, routine, btn) {
    confirmChoice({
      title: "Stop the routine too?",
      sub: "This run was created by a recurring routine (" + esc(recurLabel(routine.schedule)) + "). Deleting just this run won't stop it — the routine will keep creating new runs.",
      actions: [
        { key: "cancel", label: "Cancel", cls: "btn-ghost" },
        { key: "one", label: "Delete run only" },
        { key: "stop", label: "Stop routine", cls: "btn-danger", grow: true }
      ]
    }).then(function (choice) {
      if (!choice || choice === "cancel") { if (btn) btn.disabled = false; return; }
      if (choice === "one") {
        api("DELETE", "/api/ops/tasks/" + run.id)
          .then(function () { toast("info", "Run removed — routine still active"); })
          .then(refresh)
          .catch(function (err) { if (btn) btn.disabled = false; toast("bad", err.message); });
        return;
      }
      api("DELETE", "/api/ops/tasks/" + routine.id)
        .then(function () { return api("DELETE", "/api/ops/tasks/" + run.id).catch(function () {}); })
        .then(function () { toast("ok", "Routine stopped — no more runs"); })
        .then(refresh)
        .catch(function (err) { if (btn) btn.disabled = false; toast("bad", err.message); });
    });
  }

  /* ---------- init + polling ---------- */
  renderFilters();
  loadProjects();
  loadMeta();      // categories, status lanes, retry set, test gates, MAX_FIX
  loadModels();    // the new-task model picker
  refresh().catch(function (err) { toast("bad", err.message); });

  /* The runner works server-side, so the board has to learn about status changes
     on its own. It used to re-fetch every task — logs and all — every 2.5 seconds
     for as long as the page was open. Now the server announces each write to the
     task store (see onOpsChange in server/operations.js) and pushes the board down
     an SSE stream, so nothing is sent while nothing is happening.

     The poll survives as a FALLBACK, at 20s instead of 2.5s, and only runs while
     the stream is not connected: a board that had silently stopped updating would
     be worse than one that updates slowly. EventSource reconnects on its own, so
     `live` simply follows its open/error events. */
  var opsStream = null, live = false;
  function connectStream() {
    if (opsStream || !window.EventSource) return;
    try {
      opsStream = new EventSource("/api/ops/stream");
      opsStream.onopen = function () { live = true; };
      opsStream.onerror = function () { live = false; };
      opsStream.onmessage = function (e) {
        if (!e.data) return;
        var msg; try { msg = JSON.parse(e.data); } catch (err) { return; }
        if (msg && msg.type === "tasks") { live = true; tasks = msg.tasks || []; renderAll(); }
      };
    } catch (err) { live = false; }
  }
  connectStream();
  setInterval(function () { if (!live) refresh().catch(function () {}); }, 20000);
  // A phone suspends the page the moment the screen locks, which can leave the
  // stream half-open. Coming back into view is the cue to catch up at once.
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState !== "visible") return;
    refresh().catch(function () {});
  });
  // meta.projects carries each project's test gate, and a project gains or loses
  // one when its test setup changes. Re-read it occasionally — but nowhere near
  // as often as the board, since it also rescans the workspace root.
  setInterval(function () { loadMeta(); }, 120000);
})();
</script>
</body>
</html>
